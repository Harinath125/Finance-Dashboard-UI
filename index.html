<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard</title>
    <meta name="description" content="A clean and interactive finance dashboard interface.">

    <!-- React -->
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
    <script>
        window.ChartJS = window.Chart;
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#10b981',
                        danger: '#ef4444',
                        background: '#f8fafc',
                        surface: '#ffffff',
                        'dark-bg': '#0f172a',
                        'dark-surface': '#1e293b'
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
    @layer base {
        body {
            @apply bg-background text-slate-800 dark:bg-dark-bg dark:text-slate-200 transition-colors duration-200;
        }
    }

    @layer components {
        .card {
            @apply bg-surface dark:bg-dark-surface rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 transition-colors duration-200;
        }
        .btn {
            @apply inline-flex items-center justify-center px-4 py-2 rounded-lg font-medium transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed;
        }
        .btn-primary {
            @apply bg-primary text-white hover:bg-indigo-700 focus:ring-indigo-500;
        }
        .btn-secondary {
            @apply bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 focus:ring-slate-500;
        }
        .input-field {
            @apply w-full rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors duration-200;
        }
        .label {
            @apply block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1;
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Application Scripts -->
    <script type="text/babel" src="utils/mockData.js"></script>
    <script type="text/babel" src="utils/export.js"></script>
    <script type="text/babel" src="context/AppContext.js"></script>
    
    <script type="text/babel" src="components/Charts.js"></script>
    <script type="text/babel" src="components/SummaryCards.js"></script>
    <script type="text/babel" src="components/Insights.js"></script>
    <script type="text/babel" src="components/TransactionModal.js"></script>
    <script type="text/babel" src="components/TransactionList.js"></script>
    <script type="text/babel" src="components/Layout.js"></script>
    <script type="text/babel" src="pages/Dashboard.js"></script>
    
    <script type="text/babel" src="app.js"></script>
</body>
</html>
